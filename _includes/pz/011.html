<div class="pz"><style>
.pz {
--navy: #1f2a44;
--accent: #9457d1;
--green: #2f9e58;
--red: #d1483f;
--bg: #f7f4fb;
--card: #ffffff;
--line: #e5ddf0;
}
.pz * { box-sizing: border-box; }
.pz, .pz { height: 100%; overflow-x: hidden; }
.pz {
margin: 0;
font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
background: var(--bg);
color: var(--navy);
}
.pz .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 clamp(10px,4vw,20px) 40px; }
.pz .topBar { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 14px 0 10px; }
.pz .badge {
display: inline-block; background: var(--navy); color: white; font-weight: 700;
font-size: 13px; letter-spacing: 0.05em; padding: 6px 14px; border-radius: 999px; margin-bottom: 8px;
}
.pz h1 { font-size: clamp(18px, 4.2vw, 22px); margin: 2px 0 2px; }
.pz .sub { color: #6b6480; font-size: 13.5px; margin-bottom: 4px; }
.pz .card {
background: var(--card); border: 1px solid var(--line); border-radius: 16px;
padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(31,42,68,0.05);
}
.pz .puzzleCard { position: sticky; top: var(--topbar-h, 92px); z-index: 15; }
.pz svg { width: 100%; max-width: 340px; display:block; margin: 0 auto; height: auto; overflow: visible; }
.pz text.num {
font-size: 26px; font-weight: 700; fill: #1f2a44; font-family: inherit;
dominant-baseline: middle; transition: fill 0.4s ease, opacity 0.3s ease;
}
.pz text.num.active { fill: var(--accent); }
.pz text.num.good { fill: var(--green); }
.pz text.num.odd { fill: var(--red); font-size: 30px; }
.pz .statusBar {
margin-top: 8px; text-align: center; font-size: 15px; font-weight: 700;
min-height: 26px; color: var(--accent); transition: color 0.3s ease;
}
.pz .statusBar.good { color: var(--green); }
.pz .statusBar.bad { color: var(--red); }
.pz .formulaBubble { text-align:center; font-size: 17px; font-weight: 800; color: var(--accent); min-height: 26px; }
@keyframes popIn {
0% { opacity: 0; transform: scale(0.4); }
60% { opacity: 1; transform: scale(1.3); }
100% { opacity: 1; transform: scale(1); }
}
.pz .pop { animation: popIn 0.6s ease; }
.pz .hintsCard { display: flex; flex-direction: column; }
.pz .hintList { max-height: 30vh; overflow-y: auto; margin-bottom: 10px; scroll-behavior: smooth; }
.pz .hint-item { display: flex; gap: 10px; padding: 12px 4px; border-bottom: 1px dashed var(--line); animation: fadeIn 0.4s ease; }
.pz .hint-item:last-child { border-bottom: none; }
.pz .hint-num {
flex-shrink: 0; width: 24px; height: 24px; background: var(--accent); color: white;
border-radius: 50%; display: flex; align-items: center; justify-content: center;
font-size: 12.5px; font-weight: 700;
}
.pz .hint-text { font-size: 14.5px; line-height: 1.5; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.pz button {
width: 100%; padding: 14px; font-size: 15.5px; font-weight: 700; border: none;
border-radius: 12px; background: var(--navy); color: white; cursor: pointer; transition: opacity 0.2s;
}
.pz button:disabled { background: #b6acc9; cursor: default; }
.pz button:active { opacity: 0.85; }
.pz .progress { display: flex; gap: 6px; margin-bottom: 12px; }
.pz .dot { flex: 1; height: 5px; border-radius: 4px; background: var(--line); transition: background 0.3s; }
.pz .dot.on { background: var(--accent); }
.pz .resultCard {
display:none; background: linear-gradient(135deg,#f6effc,#f1e7fa); border: 1px solid #e0cff2;
border-radius: 18px; padding: 26px 18px; text-align:center; margin-bottom: 14px;
opacity: 0; transform: translateY(8px) scale(0.97); transition: opacity 0.6s ease, transform 0.6s ease;
}
.pz .resultCard.show { display:block; opacity:1; transform: translateY(0) scale(1); }
.pz .resultCard .ans { font-size: 56px; font-weight: 800; color: var(--accent); margin: 8px 0; }
.pz .resultCard .desc { font-size: 15px; color: #5a4a70; line-height: 1.7; }
.pz .source { font-size: 12px; color: #9a92a8; text-align: center; margin-top: 4px; line-height: 1.6; }
.pz{background:var(--bg);border-radius:16px;padding:12px 0 4px;margin:12px 0 24px;font-family:inherit;line-height:normal}
.pz .wrap{padding:0 clamp(10px,3vw,16px) 16px}
.pz .topBar{position:static}
.pz .puzzleCard{top:76px}
.pz h1{margin:2px 0}
.pz .sub{margin:0}
.pz button{font-family:inherit}
.pz .hintList{max-height:26vh}
.pz{height:auto}
</style>
<div class="wrap">
<div class="topBar">
<span class="badge">PUZZLE 011</span>
<h1>⭕ 원 안의 숫자 찾기</h1>
<div class="sub">힌트를 하나씩 눌러보면서 다른 숫자들과 공통점이 없는 숫자를 찾아보자!</div>
</div>
<div class="card puzzleCard">
<svg viewBox="0 0 320 340" xmlns="http://www.w3.org/2000/svg">
<circle cx="160" cy="170" r="155" fill="#fffdf8" stroke="#1f2a44" stroke-width="4"/>
<text x="160" y="62" text-anchor="middle" class="num" id="n28">28</text>
<text x="65" y="112" text-anchor="middle" class="num" id="n82">82</text>
<text x="152" y="122" text-anchor="middle" class="num" id="n19">19</text>
<text x="255" y="132" text-anchor="middle" class="num" id="n37">37</text>
<text x="42" y="178" text-anchor="middle" class="num" id="n55">55</text>
<text x="52" y="218" text-anchor="middle" class="num" id="n64">64</text>
<text x="152" y="208" text-anchor="middle" class="num" id="n38">38</text>
<text x="62" y="268" text-anchor="middle" class="num" id="n73">73</text>
<text x="155" y="305" text-anchor="middle" class="num" id="n91">91</text>
<text x="242" y="282" text-anchor="middle" class="num" id="n46">46</text>
</svg>
<div class="formulaBubble" id="formulaBubble"></div>
<div class="statusBar" id="statusBar"></div>
</div>
<div class="resultCard" id="resultCard">
<div style="font-size:14px;font-weight:700;color:#5a4a70;">정답은</div>
<div class="ans">38</div>
<div class="desc">다른 아홉 숫자는 모두 자리수를 더하면 10이 되지만,<br>38만 3+8=11 이라서 공통점이 없어요.</div>
</div>
<div class="card hintsCard">
<div class="progress" id="progress"></div>
<div class="hintList" id="hintList"></div>
<button id="nextBtn" onclick="showNextHint()">💡 힌트 보기 (1/4)</button>
</div>
<div class="source">
출처: 《멘사 창의력 퍼즐 Mensa Mind Maze Quest》 존 브렘너 지음 · 권태은 옮김 · 보누스 (PUZZLE 011)
</div>
</div>
<script>
const hints = [
  "원 안에 있는 숫자 10개를 하나씩 살펴보자. 각 숫자의 십의 자리 숫자와 일의 자리 숫자를 더해보자. 예) 28 → 2+8=10",
  "나머지 숫자들도 똑같이 자리수를 더해보자: 82, 19, 37, 55, 64, 73, 91, 46, 38. 계산한 값들을 비교해보면 어떤 공통점이 보일까?",
  "대부분의 숫자는 자리수를 더하면 똑같은 값이 나올 거야. 그 값이 무엇인지 확인해보자.",
  "이제 그 값과 다른 자리수 합을 가진 숫자가 딱 하나 있어. 그 숫자를 찾아보자!"
];
const order = [
  ["n28", 28],
  ["n82", 82],
  ["n19", 19],
  ["n37", 37],
  ["n55", 55],
  ["n64", 64],
  ["n38", 38],
  ["n73", 73],
  ["n91", 91],
  ["n46", 46]
];

let shown = 0;
const listEl = document.getElementById('hintList');
const btn = document.getElementById('nextBtn');
const progressEl = document.getElementById('progress');

for (let i = 0; i < hints.length; i++) {
  const d = document.createElement('div');
  d.className = 'dot';
  progressEl.appendChild(d);
}

function showNextHint() {
  if (shown >= hints.length) return;
  const item = document.createElement('div');
  item.className = 'hint-item';
  item.innerHTML = `<div class="hint-num">${shown+1}</div><div class="hint-text">${hints[shown]}</div>`;
  listEl.appendChild(item);
  progressEl.children[shown].classList.add('on');
  shown++;
  listEl.scrollTop = listEl.scrollHeight;
  if (shown < hints.length) {
    btn.textContent = `💡 힌트 보기 (${shown+1}/${hints.length})`;
  } else {
    btn.textContent = '힌트를 모두 확인했어요 ✅';
    btn.disabled = true;
    runAnimation();
  }
}

function wait(ms) { return new Promise(res => setTimeout(res, ms)); }
function setStatus(text, cls) {
  const s = document.getElementById('statusBar');
  s.textContent = text;
  s.className = 'statusBar' + (cls ? (' ' + cls) : '');
}
function setFormula(text) { document.getElementById('formulaBubble').textContent = text; }
function digitSum(n) { return String(n).split('').reduce((a,c)=>a+parseInt(c),0); }

async function runAnimation() {
  await wait(600);
  setStatus('숫자를 하나씩 확인하며 자리수를 더해볼게요', 'blue');
  await wait(1800);

  for (const [id, val] of order) {
    const el = document.getElementById(id);
    el.classList.add('active');
    const ds = digitSum(val);
    const tens = Math.floor(val/10);
    const ones = val % 10;
    setFormula(`${tens} + ${ones} = ${ds}`);
    await wait(1300);
    if (ds === 10) {
      el.classList.remove('active');
      el.classList.add('good');
      setStatus(`${val} → 10 ✅`, 'good');
    } else {
      el.classList.remove('active');
      el.classList.add('odd', 'pop');
      setStatus(`${val} → ${ds}  다른 숫자들과 달라요!`, 'bad');
    }
    await wait(900);
  }

  setFormula('');
  setStatus('다른 숫자들은 모두 자리수 합이 10인데, 38만 11이에요!', 'bad');
  await wait(2200);

  document.getElementById('resultCard').classList.add('show');
}
</script></div>
